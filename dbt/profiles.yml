hatid:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('HATID_CH_HOST', 'localhost') }}"
      port: "{{ env_var('HATID_CH_PORT', '8123') | int }}"
      user: "{{ env_var('HATID_CH_USER', 'hatid') }}"
      password: "{{ env_var('HATID_CH_PASSWORD', 'hatid') }}"
      schema: analytics
      threads: 4
